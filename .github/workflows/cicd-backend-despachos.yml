name: CI/CD - Backend Despachos

on:
  push:
    branches: [ deploy ]
    paths:
      - 'back-Despachos_SpringBoot/**'
  workflow_dispatch:

env:
  DOCKER_USER: TU_USUARIO_DOCKER
  IMAGE_NAME: tienda-backend-despachos
  EC2_INSTANCE: i-xxxxxxxxxxxxx
  DB_HOST: ip-privada-ec2-db

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND=$(cat <<'CMDEOF'
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
            docker stop backend-despachos || true
            docker rm backend-despachos || true
            docker run -d --name backend-despachos -p 8081:8081 \
              -e DB_ENDPOINT=${{ env.DB_HOST }} \
              -e DB_PORT=3306 \
              -e DB_NAME=tienda_perritos \
              -e DB_USERNAME=root \
              -e DB_PASSWORD=admin123 \
              --restart unless-stopped \
              ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
          CMDEOF
          )
          aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$COMMAND" \
            --region us-east-1 \
            --output text
